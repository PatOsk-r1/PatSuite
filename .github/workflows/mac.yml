# Mac build: compiles every Pat plugin (VST3 + AU + Standalone, Apple Silicon + Intel), runs the
# unit tests and builds dist/PatSuite-<version>-Mac.dmg (an installer .pkg inside).
# Run it from the Actions tab ("Run workflow"), or push a tag like v3.1.4 to also publish the .dmg
# as a GitHub release. PatWave and PatVerb are checked out from their own repositories.
# Speed: each plugin builds on its own Mac (GitHub runs several at once), ccache keeps what was
# already compiled, and the last job joins them all into the .dmg.
name: Mac

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: PatWave, plugin: PatWave }
          - { project: PatVerb, plugin: PatVerb }
          - { project: PatSuite, plugin: PatBass }
          - { project: PatSuite, plugin: PatQpro }
          - { project: PatSuite, plugin: PatTune }
          - { project: PatSuite, plugin: PatMaster }
          - { project: PatSuite, plugin: PatSquash }
          - { project: PatSuite, plugin: PatDeEsser }
          - { project: PatSuite, plugin: PatChain }
          - { project: PatSuite, plugin: PatDoubler }
          - { project: PatSuite, plugin: Patan }
          - { project: PatSuite, plugin: PatPatPat }
    runs-on: macos-14
    timeout-minutes: 120
    name: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          path: ${{ matrix.project }}
      - name: Dependencies (JUCE 9.0.4, Ninja, ccache)
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list ccache >/dev/null 2>&1 || brew install ccache
          mkdir -p ${{ matrix.project }}/third_party
          git clone --quiet --depth 1 --branch 9.0.4 https://github.com/juce-framework/JUCE.git ${{ matrix.project }}/third_party/JUCE
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ matrix.plugin }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.plugin }}-
      - name: Build
        run: |
          p=${{ matrix.project }}
          up=$(echo $p | tr '[:lower:]' '[:upper:]')
          ccache --max-size=1G
          cmake -S $p -B $p/build/mac -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D${up}_COPY_VST3=OFF -D${up}_BUILD_TESTS=OFF
          cmake --build $p/build/mac --target ${{ matrix.plugin }}_All --parallel 3 -- -k 0
          ccache --show-stats | head -5
      # Only the finished bundles move on (tar keeps permissions and symlinks).
      - name: Collect
        run: |
          cd ${{ matrix.project }}/build/mac
          find . -path "*${{ matrix.plugin }}_artefacts/Release/*" \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -prune -print \
            | tar czf "$GITHUB_WORKSPACE/${{ matrix.plugin }}.tgz" -T -
      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.plugin }}
          path: ${{ matrix.plugin }}.tgz
          retention-days: 3

  tests:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: PatSuite
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PatWave
          path: PatWave
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PatVerb
          path: PatVerb
      - name: Unit tests (audio engines, no plugins)
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          git clone --quiet --depth 1 --branch 9.0.4 https://github.com/juce-framework/JUCE.git deps/JUCE
          curl -sL https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz | tar xz -C deps
          for p in PatSuite PatWave PatVerb; do
            up=$(echo $p | tr '[:lower:]' '[:upper:]')
            mkdir -p $p/third_party
            cp -R deps/JUCE $p/third_party/JUCE
            cp -R deps/googletest-1.17.0 $p/third_party/googletest
            plug=PLUGINS; [ $p != PatSuite ] && plug=PLUGIN
            cmake -S $p -B $p/build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -D${up}_BUILD_${plug}=OFF
            cmake --build $p/build/tests --parallel 3
            ctest --test-dir $p/build/tests --output-on-failure
          done

  package:
    needs: [plugin, tests]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: PatSuite
      - uses: actions/download-artifact@v4
        with:
          pattern: built-*
          merge-multiple: true
      - name: Package
        run: |
          for t in *.tgz; do
            name=${t%.tgz}
            case $name in PatWave|PatVerb) dest=$name ;; *) dest=PatSuite ;; esac
            mkdir -p $dest/build/mac
            tar xzf $t -C $dest/build/mac
          done
          version=$(sed -n 's/^project(PatSuite VERSION \([0-9.]*\).*/\1/p' PatSuite/CMakeLists.txt)
          bash PatSuite/tools/package-mac.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: PatSuite-Mac
          path: PatSuite/dist/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" PatSuite/dist/*.dmg --repo "${GITHUB_REPOSITORY}" --title "PatSuite ${GITHUB_REF_NAME}" --notes "PatSuite for Mac." || gh release upload "${GITHUB_REF_NAME}" PatSuite/dist/*.dmg --repo "${GITHUB_REPOSITORY}" --clobber
