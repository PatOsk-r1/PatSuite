# Mac build: compiles every Pat plugin (VST3 + AU + Standalone, Apple Silicon + Intel), runs the
# unit tests and builds dist/PatSuite-<version>-Mac.dmg (an installer .pkg inside).
# Run it from the Actions tab ("Run workflow"), or push a tag like v3.1.4 to also publish the .dmg
# as a GitHub release. PatWave and PatVerb are checked out from their own repositories.
# Speed: the three projects build at the same time on three Macs, and ccache keeps what was
# already compiled, so a small change rebuilds in minutes.
name: Mac

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        project: [PatSuite, PatWave, PatVerb]
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          path: ${{ matrix.project }}

      - name: Dependencies (JUCE 9.0.4, GoogleTest 1.17.0, Ninja, ccache)
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list ccache >/dev/null 2>&1 || brew install ccache
          p=${{ matrix.project }}
          mkdir -p $p/third_party
          git clone --quiet --depth 1 --branch 9.0.4 https://github.com/juce-framework/JUCE.git $p/third_party/JUCE
          curl -sL https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz | tar xz -C $p/third_party
          mv $p/third_party/googletest-1.17.0 $p/third_party/googletest

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ matrix.project }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.project }}-

      - name: Build
        run: |
          p=${{ matrix.project }}
          up=$(echo $p | tr '[:lower:]' '[:upper:]')
          ccache --max-size=2G
          cmake -S $p -B $p/build/mac -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D${up}_COPY_VST3=OFF
          cmake --build $p/build/mac --parallel 3 -- -k 0  # keep going: show every error at once
          ccache --show-stats | head -5

      - name: Tests
        run: ctest --test-dir ${{ matrix.project }}/build/mac --output-on-failure

      # Only the finished bundles move on to packaging (tar keeps permissions and symlinks).
      - name: Collect plugins
        run: |
          p=${{ matrix.project }}
          cd $p/build/mac
          find . -path "*_artefacts/Release/*" \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -prune -print \
            | grep -v PatTemplate | tar czf "$GITHUB_WORKSPACE/$p-mac.tgz" -T -

      - uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.project }}
          path: ${{ matrix.project }}-mac.tgz
          retention-days: 3

  package:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: PatSuite
      - uses: actions/download-artifact@v4
        with:
          pattern: built-*
          merge-multiple: true
      - name: Package
        run: |
          for p in PatSuite PatWave PatVerb; do
            mkdir -p $p/build/mac
            tar xzf $p-mac.tgz -C $p/build/mac
          done
          version=$(sed -n 's/^project(PatSuite VERSION \([0-9.]*\).*/\1/p' PatSuite/CMakeLists.txt)
          bash PatSuite/tools/package-mac.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: PatSuite-Mac
          path: PatSuite/dist/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" PatSuite/dist/*.dmg --repo "${GITHUB_REPOSITORY}" --title "PatSuite ${GITHUB_REF_NAME}" --notes "PatSuite for Mac." || gh release upload "${GITHUB_REF_NAME}" PatSuite/dist/*.dmg --repo "${GITHUB_REPOSITORY}" --clobber
